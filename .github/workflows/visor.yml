name: Visor de trayectorias

# Construye el visor desde los CSV crudos y lo publica en GitHub Pages (sitio público).
# Los datos procesados no se versionan: se generan en cada corrida.
on:
  push:
    branches: [main, master]
    paths:
      - "data/raw/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/visor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega otro push, se cancela la corrida anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Instalar Python y dependencias
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Construir visor
        run: uv run python -m edu_data.visor

      - name: Controles de calidad
        run: uv run python -m edu_data.validacion > /dev/null

      - name: Preparar sitio para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/visor/

      - name: Subir controles de calidad
        uses: actions/upload-artifact@v4
        with:
          name: validacion
          path: outputs/validacion_*.csv
          retention-days: 30

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
