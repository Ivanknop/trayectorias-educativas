[project]
name = "analisis-trayectorias"
version = "0.1.0"
description = "Trayectorias escolares en Argentina (RA, DiNIEE): base por ciclo, controles de calidad y visor"
requires-python = ">=3.12"
dependencies = [
    # Manipulación de datos
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    # Formatos frecuentes en datos oficiales
    "openpyxl>=3.1",    # .xlsx
    "xlrd>=2.0",        # .xls viejos (anuarios, relevamientos)
    "pyreadstat>=1.2",  # SPSS / Stata / SAS (PISA, Aprender, encuestas)
    # Estadística
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    # Visualización
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    # Geografía (departamentos, jurisdicciones)
    "geopandas>=1.0",
    # Notebooks y utilidades
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_data"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
